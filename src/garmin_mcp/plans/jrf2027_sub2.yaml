# Training plan: Sub-2:00 half marathon at JRF 2027.
# Source: "Sub-2:00 HM · JRF 2027" plan doc (tabs "1 · Milestone" and "2 · Jadwal mingguan").
#
# Session mini-language (used in `days`, `key`, `second`, and `tests`):
#   segments are joined with " · "
#   <amount><unit> <zone>       e.g. "4km easy", "40min easy", "20s strides"
#   <n>x(<seg> / <seg>)         repeat block with recovery, e.g. "2x(3km tempo / 1km steady)"
#   units: km (default), min, s
#   zones: recovery, easy, aerobic_test, steady, tempo, tempo_test, hmp, tt, race, strides
#   a session string of "rest" means no run.

name: "Sub-2:00 HM · JRF 2027"
athlete: alfatih
timezone: Asia/Jakarta
start_date: 2026-11-02 # Monday of week 0

goal:
  event: "Jakarta Running Festival 2027 – Half Marathon"
  date: 2027-10-24
  distance_km: 21.0975
  target: "1:59:59"
  pass: "2:05:00"
  stretch: "1:55:00"
  baseline: "2:53 at JRF 2026 (bonked at km 10)"

baseline:
  easy_pace_at_143_147: "7:00" # min/km, estimate
  comfortable_long_run_km: 10
  weekly_km: 21

end_targets:
  easy_pace_at_143_147: "6:15"
  comfortable_long_run_km: 22
  weekly_km: "50–60 (5–6 runs), habitual from May"

# Heart-rate zones in bpm. "HR always beats pace" – humid mornings slow pace 15–30 s/km at the same HR.
zones:
  recovery: { max: 137, use: "Easy Thursday, Sunday after a hard Saturday" }
  easy: { min: 138, max: 150, use: "Almost every run" }
  aerobic_test: { min: 143, max: 147, use: "30-min core of the monthly aerobic test (Thursday)" }
  steady: { min: 148, max: 155, use: "Steady LR – even, short sentences possible" }
  tempo: { min: 158, max: 165, use: "Tempo block in Tempo LR" }
  tempo_test: { min: 160, max: 165, use: "20-min core of the Tuesday tempo test" }
  hmp: { use: "Half-marathon race pace; set from the 10K TT on 19 Sep (10K pace + 15 s/km)" }
  strides: { use: "Strides – ignore HR" }
  tt: { use: "Time trial – ignore HR" }
  race: { use: "Race – ignore HR" }

rules:
  easy_hr_cap: 150
  easy_share_target: 0.80 # ≥80% of running time at HR ≤ 150
  key_run_max_minutes: 120 # stop at 2 h even if the distance is not reached
  key_run_min_km: 15
  comfortable_long_run: "No walking, HR ≤ 150 to the end, aerobic decoupling < 5%, and able to do +2 km"
  decoupling_ok_pct: 5
  sleep_hours_target: 7
  sleep_nights_target: 5
  key_day_default: sat
  weekend_shift: >-
    Key run on whichever weekend day you feel freshest. Key Saturday → Sunday easy.
    Key Sunday → Saturday rest or easy 30 min only, and move Monday's Leg A to Tuesday evening.
  fueling: >-
    Key runs > 75 min: carry 30–45 g carbs/h from minute 40 (gel every ~40 min); 60 g/h from March
    (from August for race rehearsal). Start long runs ≤ 05:00. Weigh before/after: > 2% loss = drank too little.
  morning_runs: "Start 50 min after Subuh; asleep no later than 7 h before next Subuh on nights before a run."
  plateau_rules:
    improving: "Easy test pace improves ≥ 5 s/km vs last month → keep the schedule."
    slowing: "Improves < 5 s/km two months in a row → move to the next volume step sooner, or add 2 km to the long run."
    plateau: "Flat (±3 s/km) two months in a row while already at 55–60 km and a comfortable 20 km key run → start phase B early."
    regressing: "Easy pace or HR worse by ≥ 5 s/km or ≥ 5 bpm → that's fatigue, not a plateau. One week at −25%, then continue."
  disruption:
    - "Missed ≤ 3 days: just continue, don't make it up."
    - "Missed ~1 week: repeat the last completed week."
    - "Missed ≥ 2 weeks: go back 2 weeks in the schedule, catch up by shortening one hold phase ahead."
    - "Busy week priority: Saturday long run > Sunday > Wednesday > Tue/Thu."
    - "Easy HR up ≥ 5 bpm at the same pace for 3+ days, or several bad nights of sleep in a row: one week at −25%, then continue from the previous level."
    - "Sick above the neck: easy only. Fever or below the neck: stop; run again after 2 symptom-free days."
    - "Chest pain, unusual palpitations, or dizziness while running: stop and see a doctor."
    - "Bone pain (shin, foot) that keeps getting worse: stop 3–5 days."
  race_execution: >-
    km 0–5 deliberately 5–10 s/km slower than race pace, km 5–15 even, km 15–21 empty the tank.
    Gels at km 5, 10, 15.
  race_pace_from_10k_tt_offset_s: 15
  backup_path: >-
    If TT on 31 Jul > 57:00: accept a 2:02–2:05 target, or add a continuous race-pace block to 3 long runs
    (still no intervals). Decided on 1 Aug.

strength:
  leg_a: "Leg A – strength (Mon evening, 30–40 min): squat or split squat, Romanian deadlift, hip thrust. 3 × 6–8, leave 2 reps in reserve."
  leg_b: "Leg B – stability (Wed evening, 30–40 min): step-up, single-leg RDL, heavy single-leg calf raise, side plank / Copenhagen. 2–3 × 8–12."
  notes: "Both ≥ 2.5 days before Saturday's key run; finish ≥ 2 h before bed. From August keep the load but cut sets; stop 10 days before the race."

weekly_checklist:
  pass_score: 5 # of 6
  items:
    - id: weekday_runs
      text: "Weekday runs at least 3× (Apr–Oct: 4×), all easy"
    - id: key_run
      text: "Key long run done without walking, steady/tempo block kept even"
    - id: legs
      text: "Leg A and Leg B done"
    - id: easy_share
      text: "≥ 80% of running time at HR ≤ 150"
    - id: strides
      text: "Tuesday strides"
    - id: sleep
      text: "Sleep ≥ 7 h on at least 5 nights"
  hold_rule: "If two weeks in a row score ≤ 3, hold volume (don't increase) until consistent again."

phases:
  - { name: "Base 1", start: 2026-11-02, end: 2027-02-07, volume: "30 → 40 km, stable", focus: "2 weekday runs + 2 weekend sessions, key run 15 → 18 km (max 2 h)", gate: "10K TT 30 Jan" }
  - { name: "Ramadan", start: 2027-02-08, end: 2027-03-14, volume: "±28 km (−35%)", focus: "Night runs after tarawih, all easy, no long run", gate: null }
  - { name: "Base 2", start: 2027-03-15, end: 2027-05-09, volume: "40 → 50 km", focus: "4th weekday run (Friday) from end of March", gate: "HM TT 1 May finished without walking" }
  - { name: "High mileage", start: 2027-05-10, end: 2027-08-01, volume: "50 → 60 km, held", focus: "3 months habitual at 50–60 km, key run 18–20 km", gate: "3 months consistent at 50–60 km" }
  - { name: "HM block", start: 2027-08-02, end: 2027-10-03, volume: "55–60 km", focus: "Key run at race pace, race-day practice", gate: "TT 19 Sep → race pace" }
  - { name: "Taper", start: 2027-10-04, end: 2027-10-24, volume: "45 → 35 km", focus: "Race JRF 2027", gate: "Race" }

